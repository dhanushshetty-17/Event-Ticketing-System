server.port=8080

spring.task.scheduling.enabled=false
spring.application.name=event-ticketing-system

spring.datasource.url=jdbc:postgresql://localhost:5432/event_ticketing
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.dynamic=true

reservation.duration-minutes=10

redis.address=redis://localhost:6379
redis.connection-timeout-millis=3000
redis.lock-wait-timeout-millis=2000
redis.lock-lease-timeout-millis=5000
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=30

rabbitmq.exchange=booking.exchange
rabbitmq.booking-confirmed-routing-key=booking.confirmed
rabbitmq.ticket-queue=ticket.generation.queue
