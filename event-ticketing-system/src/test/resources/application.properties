
server.port=${SERVER_PORT:8080}
spring.application.name=event-ticketing-system
app.seed.demo-data=true

spring.task.scheduling.enabled=${SCHEDULING_ENABLED:false}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/event_ticketing}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.dynamic=true
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true




# Redis
redis.address=${REDIS_ADDRESS:redis://localhost:6379}
redis.connection-timeout-millis=3000
redis.lock-wait-timeout-millis=2000
redis.lock-lease-timeout-millis=5000

# Reservation
reservation.duration-minutes=10

# JWT
security.jwt.secret=test-only-jwt-secret-which-is-at-least-32-bytes
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}

# RabbitMQ application routing
rabbitmq.exchange=booking.exchange
rabbitmq.booking-confirmed-routing-key=booking.confirmed
rabbitmq.ticket-queue=ticket.generation.queue
